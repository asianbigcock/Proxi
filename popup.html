<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proxi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <section class="modes" aria-label="代理模式" data-i18n-aria="modesLabel">
        <button class="mode" data-mode="direct"><i class="dot direct"></i><span><b data-i18n="direct">直接连接</b><small data-i18n="directHint">不使用代理</small></span></button>
        <button class="mode" data-mode="system"><i class="dot system"></i><span><b data-i18n="system">系统代理</b><small data-i18n="systemHint">跟随操作系统设置</small></span></button>
        <div class="mode custom-mode" data-mode="custom" role="button" tabindex="0">
          <i class="dot custom"></i>
          <span><b data-i18n="custom">规则判定</b><small data-i18n="customHint">使用已保存配置</small></span>
          <button id="editProxy" class="edit" type="button" title="编辑代理设置" aria-label="编辑代理设置" data-i18n-title="editProxy" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5V20h3.5L18.1 9.4l-3.5-3.5L4 16.5Zm16.7-9.8a1 1 0 0 0 0-1.4l-2-2a1 1 0 0 0-1.4 0l-1.6 1.6 3.5 3.5 1.5-1.7Z"/></svg>
          </button>
        </div>
      </section>

      <form id="customForm" class="custom-panel">
        <div class="row">
          <label><span data-i18n="scheme">协议</span><select id="scheme"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks4">SOCKS4</option><option value="socks5">SOCKS5</option></select></label>
          <label class="host"><span data-i18n="host">IP 地址</span><input id="host" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="15" pattern="(?:[0-9]{1,3}\.){3}[0-9]{1,3}" placeholder="127.0.0.1" required /></label>
          <label class="port"><span data-i18n="port">端口</span><input id="port" type="text" inputmode="numeric" autocomplete="off" maxlength="5" pattern="[0-9]{1,5}" placeholder="7890" required /></label>
        </div>
        <label><span data-i18n="bypass">忽略地址</span><textarea id="bypassList" rows="2" placeholder="localhost, 127.0.0.1, &lt;local&gt;"></textarea></label>
        <button type="submit" class="save" data-i18n="saveAndEnable">保存并启用</button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
